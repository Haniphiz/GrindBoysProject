<!DOCTYPE html>
<html>
<head>
  <title>Register Hotel</title>

  <style>
    
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;

     background: 
    linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
    url("https://images.pexels.com/photos/261102/pexels-photo-261102.jpeg");

      background-size: cover;
      background-position: center;

      display: flex;
      justify-content: center;
      align-items: center;

      animation: zoomBg 20s infinite alternate;
    }

    @keyframes zoomBg {
      from { background-size: 100%; }
      to { background-size: 110%; }
    }

    .card {
      width: 350px;
      padding: 30px;

      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);

      border-radius: 15px;
      text-align: center;
      color: white;

      box-shadow: 0 0 25px rgba(0,0,0,0.4);
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      opacity: 0.85;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;

      border-radius: 8px;
      border: none;

      background: rgba(255,255,255,0.2);
      color: white;
    }

    input::placeholder {
      color: #eee;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;

      border: none;
      border-radius: 8px;

      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      font-weight: bold;
      cursor: pointer;

      transition: 0.3s;
    }

    button:hover {
      opacity: 0.85;
    }

    a {
      color: #00c6ff;
      text-decoration: none;
    }

    .title {
      position: absolute;
      top: 40px;
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="title">Selamat Datang to GrindBoys Hotel</div>

<div class="card">
  <h2>Buat Akun Baru</h2>
  <p>Daftar untuk menikmati pengalaman menginap terbaik</p>

  <input id="email" type="email" placeholder="Email">
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Register</button>

  <p>Sudah punya akun? <a href="login.html">Login</a></p>
</div>

<script src="script.js"></script>

</body>
</html>
